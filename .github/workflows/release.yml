name: Release

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release-please:
        name: Prepare release
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Create or update release pull request
              id: release
              uses: googleapis/release-please-action@v5
              with:
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        name: Publish ${{ needs.release-please.outputs.tag_name }}
        needs: release-please
        if: needs.release-please.outputs.release_created == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout release tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --strict-peer-dependencies

            - name: Verify release
              run: pnpm check

            - name: Validate tag and package version
              env:
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
              run: |
                  PACKAGE_VERSION=$(node --print "require('./package.json').version")
                  test "$TAG_NAME" = "v$PACKAGE_VERSION"

            - name: Pack
              run: |
                  mkdir -p artifacts
                  npm pack --ignore-scripts --pack-destination artifacts

            - name: Publish to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish artifacts/*.tgz --access public --provenance

            - name: Attach package to GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
              run: gh release upload "$TAG_NAME" artifacts/*.tgz --clobber
