version: 2

updates:
    - package-ecosystem: npm
      directory: /
      target-branch: master
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 10
      groups:
          azure:
              patterns: ['@azure/*']
          nestjs:
              patterns: ['@nestjs/*']
          development:
              dependency-type: development
              patterns: ['*']

    - package-ecosystem: github-actions
      directory: /
      target-branch: master
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
